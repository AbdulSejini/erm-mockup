<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>التقييم | ERM — Saudi Cable</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="erm-shell.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body data-page="assessment.html">
<div id="app">
  <div style="display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between">
    <div>
      <h1 style="margin:0;font-size:1.5rem;font-weight:700;display:flex;align-items:center;gap:.5rem"><i data-lucide="clipboard-check" style="color:var(--primary)"></i><span data-ar="تقييم المخاطر" data-en="Risk Assessment">تقييم المخاطر</span></h1>
      <p class="muted" style="margin:.25rem 0 0;font-size:.875rem" data-ar="مصفوفة 5×5 — الاحتمالية × الأثر" data-en="5×5 matrix — Likelihood × Impact">مصفوفة 5×5 — الاحتمالية × الأثر</p>
    </div>
    <div style="display:inline-flex;border-radius:.75rem;padding:.25rem;gap:.25rem;background:var(--background-tertiary)">
      <button class="mt-btn" data-mt="inherent" style="padding:.5rem 1rem;border-radius:.5rem;font-size:.8rem;font-weight:600;border:0;cursor:pointer" data-ar="كامن" data-en="Inherent">كامن</button>
      <button class="mt-btn" data-mt="residual" style="padding:.5rem 1rem;border-radius:.5rem;font-size:.8rem;font-weight:600;border:0;cursor:pointer" data-ar="متبقٍ" data-en="Residual">متبقٍ</button>
    </div>
  </div>

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.5rem">
    <div class="card">
      <div class="card-head"><h3 class="h-title"><i data-lucide="grid-3x3" style="color:var(--primary)"></i><span data-ar="مصفوفة المخاطر" data-en="Risk Matrix">مصفوفة المخاطر</span></h3></div>
      <div class="card-pad" style="display:flex;justify-content:center;padding:1.5rem">
        <div><div style="display:flex">
          <div style="display:flex;align-items:center;justify-content:center;padding-inline-end:.5rem"><span class="muted" style="font-size:.75rem;writing-mode:vertical-rl;transform:rotate(180deg)" data-ar="الاحتمالية ←" data-en="Likelihood →">الاحتمالية ←</span></div>
          <div><div id="matrix" style="display:flex;flex-direction:column-reverse"></div><div style="display:flex"><div style="width:60px"></div><div id="xaxis" style="display:flex"></div></div><div style="margin-top:.25rem;text-align:center"><span class="muted" style="font-size:.75rem" data-ar="الأثر ←" data-en="Impact →">الأثر ←</span></div></div>
        </div><div id="legend" style="margin-top:1rem;display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center"></div></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:1.5rem">
      <div class="card">
        <div class="card-head"><h3 class="h-title"><i data-lucide="trending-up" style="color:var(--primary)"></i><span data-ar="معايير الاحتمالية" data-en="Likelihood Criteria">معايير الاحتمالية</span></h3></div>
        <table class="tbl"><tbody id="likeRows"></tbody></table>
      </div>
      <div class="card">
        <div class="card-head"><h3 class="h-title"><i data-lucide="zap" style="color:var(--primary)"></i><span data-ar="معايير الأثر" data-en="Impact Criteria">معايير الأثر</span></h3></div>
        <table class="tbl"><tbody id="impRows"></tbody></table>
      </div>
    </div>
  </div>
</div>
<script>
const MC_INH={'5-5':1,'5-4':1,'4-5':1,'4-4':2,'3-4':3,'2-5':1,'3-3':4,'3-2':2,'2-3':3,'4-2':1,'2-2':5,'1-2':3,'1-1':2,'2-1':2,'1-3':1};
const MC_RES={'3-4':1,'2-3':2,'2-2':4,'3-3':2,'1-2':4,'1-1':5,'2-1':3,'1-3':3,'3-2':1,'2-4':1};
let MTMODE='inherent';
window.ermInit=function(){
  const col=(l,i)=>{const s=l*i;return s>=20?'#dc2626':s>=15?'#f97316':s>=10?'#eab308':s>=5?'#22c55e':'#3b82f6';};
  function drawMatrix(){
    const MC=MTMODE==='inherent'?MC_INH:MC_RES;let mh='';
    for(let l=1;l<=5;l++){mh+=`<div style="display:flex;align-items:center"><div style="display:flex;align-items:center;justify-content:flex-end;padding-inline-end:.5rem;width:60px;height:60px"><span class="muted" style="font-size:.8rem">${l}</span></div><div style="display:flex">`;for(let i=1;i<=5;i++){const c=MC[`${l}-${i}`]||0;mh+=`<div class="matrix-cell" style="width:60px;height:60px;background:${col(l,i)};font-size:1rem">${c||''}</div>`;}mh+=`</div></div>`;}
    document.getElementById('matrix').innerHTML=mh;
    document.getElementById('xaxis').innerHTML=[1,2,3,4,5].map(i=>`<div style="display:flex;align-items:flex-start;justify-content:center;padding-top:.5rem;width:60px"><span class="muted" style="font-size:.8rem">${i}</span></div>`).join('');
  }
  drawMatrix();
  document.getElementById('legend').innerHTML=[['#dc2626','حرج','Critical'],['#f97316','مرتفع','High'],['#eab308','متوسط','Medium'],['#22c55e','منخفض','Low'],['#3b82f6','ضئيل','Negligible']].map(([c,ar,en])=>`<div style="display:flex;align-items:center;gap:.375rem"><div style="height:.75rem;width:.75rem;border-radius:.25rem;background:${c}"></div><span class="muted" style="font-size:.75rem" data-ar="${ar}" data-en="${en}">${ar}</span></div>`).join('');

  const LIKE=[[1,'نادر','Rare','أقل من 10% احتمال الحدوث','Less than 10% chance'],[2,'غير مرجّح','Unlikely','10–30% احتمال','10–30% chance'],[3,'محتمل','Possible','30–50% احتمال','30–50% chance'],[4,'مرجّح','Likely','50–80% احتمال','50–80% chance'],[5,'شبه مؤكد','Almost Certain','أكثر من 80% احتمال','Over 80% chance']];
  const IMP=[[1,'ضئيل','Negligible','أثر مالي < 100 ألف ريال','Financial impact < SAR 100K'],[2,'بسيط','Minor','100 ألف – 1 مليون ريال','SAR 100K – 1M'],[3,'متوسط','Moderate','1 – 5 مليون ريال','SAR 1M – 5M'],[4,'كبير','Major','5 – 20 مليون ريال','SAR 5M – 20M'],[5,'كارثي','Catastrophic','أكثر من 20 مليون ريال','Over SAR 20M']];
  const rowHtml=(rows)=>rows.map(([n,la,le,da,de])=>`<tr><td style="width:48px"><span class="chip" style="background:var(--primary-light);color:var(--primary);font-weight:700">${n}</span></td><td><span style="font-weight:600;color:var(--foreground)" data-ar="${la}" data-en="${le}">${la}</span></td><td class="muted" style="font-size:.8rem" data-ar="${da}" data-en="${de}">${da}</td></tr>`).join('');
  document.getElementById('likeRows').innerHTML=rowHtml(LIKE);
  document.getElementById('impRows').innerHTML=rowHtml(IMP);

  function setMode(m){MTMODE=m;drawMatrix();document.querySelectorAll('.mt-btn').forEach(b=>{const on=b.dataset.mt===m;b.style.background=on?'var(--primary)':'transparent';b.style.color=on?'#fff':'var(--foreground-secondary)';});if(window.lucide)lucide.createIcons();}
  document.querySelectorAll('.mt-btn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mt)));
  setMode('inherent');
  if(window.lucide) lucide.createIcons(); window.ermApplyLang();
};
</script>
<script src="erm-shell.js"></script>
</body></html>
