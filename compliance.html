<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الامتثال | ERM — Saudi Cable</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="erm-shell.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body data-page="compliance.html">
<div id="app">
  <div>
    <h1 style="margin:0;font-size:1.5rem;font-weight:700;display:flex;align-items:center;gap:.5rem"><i data-lucide="shield-check" style="color:var(--primary)"></i><span data-ar="الامتثال والحوكمة" data-en="Compliance & Governance">الامتثال والحوكمة</span></h1>
    <p class="muted" style="margin:.25rem 0 0;font-size:.875rem" data-ar="متابعة الالتزام بالأنظمة والمعايير التنظيمية" data-en="Track adherence to regulations and standards">متابعة الالتزام بالأنظمة والمعايير التنظيمية</p>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem">
    <div class="stat-tile"><div class="glow" style="background:#10b981"></div><div style="position:relative"><p class="muted" style="margin:0;font-size:.8rem" data-ar="نسبة الالتزام" data-en="Compliance Rate">نسبة الالتزام</p><p style="margin:.25rem 0 0;font-size:1.875rem;font-weight:700;color:#10b981">98.5%</p></div></div>
    <div class="stat-tile"><div class="glow" style="background:#10b981"></div><div style="position:relative"><p class="muted" style="margin:0;font-size:.8rem" data-ar="ملتزم" data-en="Compliant">ملتزم</p><p style="margin:.25rem 0 0;font-size:1.875rem;font-weight:700;color:#10b981">24</p></div></div>
    <div class="stat-tile"><div class="glow" style="background:#f59e0b"></div><div style="position:relative"><p class="muted" style="margin:0;font-size:.8rem" data-ar="التزام جزئي" data-en="Partial">التزام جزئي</p><p style="margin:.25rem 0 0;font-size:1.875rem;font-weight:700;color:#f59e0b">3</p></div></div>
    <div class="stat-tile"><div class="glow" style="background:#ef4444"></div><div style="position:relative"><p class="muted" style="margin:0;font-size:.8rem" data-ar="غير ملتزم" data-en="Non-Compliant">غير ملتزم</p><p style="margin:.25rem 0 0;font-size:1.875rem;font-weight:700;color:#ef4444">1</p></div></div>
  </div>
  <div class="card">
    <div class="card-head"><h3 class="h-title"><i data-lucide="list" style="color:var(--primary)"></i><span data-ar="متطلبات الامتثال" data-en="Compliance Requirements">متطلبات الامتثال</span></h3></div>
    <div style="overflow-x:auto"><table class="tbl"><thead><tr>
      <th data-ar="المتطلب" data-en="Requirement">المتطلب</th><th data-ar="الجهة التنظيمية" data-en="Regulator">الجهة التنظيمية</th><th data-ar="المسؤول" data-en="Owner">المسؤول</th><th data-ar="الاستحقاق" data-en="Due">الاستحقاق</th><th data-ar="الحالة" data-en="Status">الحالة</th>
    </tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</div>
<script>
window.ermInit=function(){
  const ST={ok:['ملتزم','Compliant','#10b981'],partial:['جزئي','Partial','#f59e0b'],no:['غير ملتزم','Non-Compliant','#ef4444']};
  const R=[
    ['التقارير المالية وفق معايير IFRS','IFRS financial reporting','هيئة السوق المالية','CMA','المالية','Finance','2026-03-31','ok'],
    ['متطلبات حماية البيانات الشخصية','Personal data protection (PDPL)','الهيئة السعودية للبيانات','SDAIA','تقنية المعلومات','IT','2026-09-01','partial'],
    ['اشتراطات السلامة والصحة المهنية','OHS regulations','المجلس الأعلى للسلامة','HCIS','السلامة','HSE','2026-06-30','ok'],
    ['الإفصاح والحوكمة للشركات المدرجة','Corporate governance disclosure','هيئة السوق المالية','CMA','الشؤون القانونية','Legal','2026-04-30','ok'],
    ['اشتراطات الجودة ISO 9001','ISO 9001 quality','منظمة المواصفات','SASO','الجودة','Quality','2026-12-31','partial'],
    ['الامتثال البيئي للانبعاثات','Environmental emissions','المركز الوطني للرقابة','NCEC','السلامة','HSE','2026-05-15','no'],
  ];
  document.getElementById('rows').innerHTML=R.map(([ta,te,rega,rege,oa,oe,due,st])=>{const[sa,se,sc]=ST[st];return `
    <tr><td><span style="font-weight:500;color:var(--foreground)" data-ar="${ta}" data-en="${te}">${ta}</span></td>
    <td class="muted" data-ar="${rega}" data-en="${rege}">${rega}</td>
    <td class="muted" data-ar="${oa}" data-en="${oe}">${oa}</td>
    <td class="muted">${due}</td>
    <td><span class="chip" style="background:${sc}1f;color:${sc}"><i data-lucide="${st==='ok'?'check-circle':st==='partial'?'alert-circle':'x-circle'}" style="width:.85rem;height:.85rem"></i> <span data-ar="${sa}" data-en="${se}">${sa}</span></span></td></tr>`;}).join('');
  if(window.lucide) lucide.createIcons(); window.ermApplyLang();
};
</script>
<script src="erm-shell.js"></script>
</body></html>
