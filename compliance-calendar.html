<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقويم الامتثال | ERM — Saudi Cable</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="erm-shell.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body data-page="compliance-calendar.html">
<div id="app">
  <div style="display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between">
    <div>
      <h1 style="margin:0;font-size:1.5rem;font-weight:700;display:flex;align-items:center;gap:.5rem"><i data-lucide="calendar-days" style="color:var(--primary)"></i><span data-ar="تقويم الامتثال" data-en="Compliance Calendar">تقويم الامتثال</span></h1>
      <p class="muted" style="margin:.25rem 0 0;font-size:.875rem" data-ar="المواعيد والاستحقاقات التنظيمية" data-en="Regulatory deadlines and obligations">المواعيد والاستحقاقات التنظيمية</p>
    </div>
    <div style="display:flex;align-items:center;gap:.5rem">
      <button class="btn btn-outline" style="padding:.4rem .6rem"><i data-lucide="chevron-right" class="flip-x" style="width:1rem;height:1rem"></i></button>
      <span style="font-weight:600;min-width:130px;text-align:center" data-ar="يونيو 2026" data-en="June 2026">يونيو 2026</span>
      <button class="btn btn-outline" style="padding:.4rem .6rem"><i data-lucide="chevron-left" class="flip-x" style="width:1rem;height:1rem"></i></button>
    </div>
  </div>
  <div class="card"><div class="card-pad">
    <div id="dow" style="display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;margin-bottom:.4rem"></div>
    <div id="grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem"></div>
  </div></div>
</div>
<script>
window.ermInit=function(){
  const DOW_AR=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'], DOW_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  document.getElementById('dow').innerHTML=DOW_AR.map((d,i)=>`<div style="text-align:center;font-size:.72rem;font-weight:600;color:var(--foreground-secondary);padding:.3rem 0" data-ar="${d}" data-en="${DOW_EN[i]}">${d}</div>`).join('');
  // June 2026 starts on Monday (index 1). 30 days.
  const EVENTS={10:[['تحديث ضوابط الأمن','Cyber controls due','#ef4444']],15:[['الامتثال البيئي','Environmental compliance','#ef4444']],16:[['اجتماع لجنة المخاطر','Risk Committee meeting','#f59e0b']],20:[['تقرير ربعي','Quarterly report','#3b82f6']],30:[['اشتراطات السلامة','OHS requirements','#10b981']]};
  const firstDow=1, days=30; let cells='';
  for(let i=0;i<firstDow;i++) cells+=`<div></div>`;
  for(let d=1;d<=days;d++){const ev=EVENTS[d]||[];const today=d===16;
    cells+=`<div style="min-height:84px;border:1px solid var(--border);border-radius:.6rem;padding:.4rem;background:${today?'var(--primary-light)':'var(--card)'}">
      <div style="font-size:.78rem;font-weight:${today?'700':'500'};color:${today?'var(--primary)':'var(--foreground)'};margin-bottom:.25rem">${d}</div>
      ${ev.map(([ar,en,c])=>`<div style="font-size:.6rem;line-height:1.3;padding:.15rem .3rem;border-radius:.3rem;margin-bottom:.2rem;background:${c}1f;color:${c};font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" data-ar="${ar}" data-en="${en}" title="${ar}">${ar}</div>`).join('')}
    </div>`;
  }
  document.getElementById('grid').innerHTML=cells;
  if(window.lucide) lucide.createIcons(); window.ermApplyLang();
};
</script>
<script src="erm-shell.js"></script>
</body></html>
